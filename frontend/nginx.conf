server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /health {
        proxy_pass http://backend:8000/health;
    }

    location = /city-wise {
        proxy_pass http://backend:8000/city-wise;
    }

    location = /category-wise {
        proxy_pass http://backend:8000/category-wise;
    }

    location = /source-wise {
        proxy_pass http://backend:8000/source-wise;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

